<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>空间折跃 · Tripo 物件审阅</title><style>*{box-sizing:border-box}body{margin:0;background:#0a1017;color:#dce7ed;font-family:system-ui,-apple-system,sans-serif;padding:30px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #334650;padding-bottom:20px}h1{font-size:27px;font-weight:550;letter-spacing:2px;margin:0 0 8px}p{font-size:13px;color:#98aab6;margin:0;line-height:1.7}small{color:#e1b45f;letter-spacing:2px}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;margin-top:24px}article{border:1px solid #304550;background:#111c27;min-width:0}canvas{display:block;width:100%;height:280px;touch-action:none}article h2{margin:16px 18px 5px;font-size:17px;font-weight:500}article p{margin:0 18px 16px}.waiting{height:280px;display:grid;place-items:center;color:#7e99a8;font-size:14px}button,a{background:none;color:#c4d9e2;border:1px solid #607983;padding:9px 15px;text-decoration:none;font:inherit;cursor:pointer}button:hover{border-color:#94d9e9}a{display:inline-block;font-size:12px;margin:0 18px 18px}nav{display:flex;gap:10px}#summary{margin-top:16px}@media(max-width:800px){main{grid-template-columns:repeat(2,minmax(0,1fr))}header{display:block}nav{margin-top:14px}}@media(max-width:500px){main{grid-template-columns:1fr}}</style><header><div><small>GRAVITY LAB / TRIPO 3.1</small><h1>空间折跃 · 六种传送物件</h1><p>实际 GLB 与 PBR 贴图 · 可拖动旋转与滚轮缩放 · 生成候选审阅</p></div><nav><button id="front">前侧视图</button><button id="back">后侧视图</button><button id="left">左侧视图</button><button id="right">右侧视图</button></nav></header><p id="summary">正在检查生成结果…</p><main id="grid"></main><script>addEventListener("error",e=>document.querySelector("#summary").textContent="预览错误："+e.message);addEventListener("unhandledrejection",e=>document.querySelector("#summary").textContent="加载错误："+e.reason);</script><script type="module" src="viewer.bundle.
